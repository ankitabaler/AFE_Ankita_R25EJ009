<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankitha // Portfolio Hub</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #141417;
            --accent-amber: #f59e0b;
            --text-white: #f3f4f6;
            --text-dim: #9ca3af;
            --border-line: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hub-container {
            max-width: 450px;
            width: 100%;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        h1 span {
            color: var(--accent-amber);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .nav-link {
            display: block;
            background: var(--bg-dark);
            color: var(--text-white);
            text-decoration: none;
            padding: 1rem;
            border: 1px solid var(--border-line);
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>Ankitha<span>.</span></h1>
        <p class="subtitle">Welcome to my project workspace</p>
        
        <!-- This link opens your about page -->
        <a href="about.html" class="nav-link">View My Biography →</a>
    </div>

</body>
</html>
